version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: digitalpmo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: digitalpmo
      POSTGRES_USER: digitalpmo
      POSTGRES_PASSWORD: digitalpmo123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitalpmo -d digitalpmo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: digitalpmo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
